version: '3.8'

services:
  # AGNI FastAPI Research Gateway
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agni_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - AIR_GAPPED_MODE=true
      - ENABLE_SANDBOX=true
      - QDRANT_STORAGE_PATH=/app/data/qdrant_storage
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    restart: unless-stopped
    depends_on:
      - qdrant

  # AGNI React 18 Production Workspace
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agni_frontend
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped
    depends_on:
      - backend

  # Standalone Qdrant Vector Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agni_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Hardened Air-Gapped Code Execution Sandbox
  sandbox_runner:
    image: python:3.11-slim
    container_name: agni_sandbox
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: ["python", "-c", "print('AGNI Sovereign Sandbox Initialized')"]
